CTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>London Life</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #07152d, #102d55);
        color: white;
        min-height: 100vh;
        padding: 15px;
        touch-action: manipulation;
    }

    .container {
        width: 100%;
        max-width: 650px;
        margin: auto;
    }

    header {
        text-align: center;
        margin-bottom: 18px;
    }

    header h1 {
        font-size: 34px;
        margin: 8px 0 5px;
    }

    header p {
        margin: 0;
        color: #c9d6ea;
        font-size: 15px;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-bottom: 18px;
    }

    .stat {
        background: rgba(255,255,255,0.09);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 10px;
        text-align: center;
    }

    .stat-title {
        font-size: 11px;
        color: #b9c8dc;
        margin-bottom: 4px;
    }

    .stat-value {
        font-size: 19px;
        font-weight: bold;
    }

    .money {
        color: #69e38a;
    }

    .debt {
        color: #ff7474;
    }

    .game-card {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .stage {
        font-size: 12px;
        color: #8fb5e9;
        text-transform: uppercase;
        font-weight: bold;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    h2 {
        font-size: 23px;
        margin: 0 0 10px;
    }

    .description {
        color: #d3dceb;
        line-height: 1.5;
        font-size: 15px;
        margin-bottom: 18px;
    }

    .option {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 15px;
        margin-bottom: 10px;
        background: #173d6d;
        color: white;
        text-align: left;
        cursor: pointer;
        transition: transform 0.1s, background 0.2s;
        font-size: 15px;
    }

    .option:active {
        transform: scale(0.98);
        background: #21548e;
    }

    .option-title {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .option-description {
        color: #c9d7e9;
        font-size: 13px;
        line-height: 1.4;
        margin-bottom: 8px;
    }

    .effects {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    .effect {
        font-size: 11px;
        padding: 4px 7px;
        border-radius: 6px;
        background: rgba(255,255,255,0.09);
    }

    .positive {
        color: #72e89a;
    }

    .negative {
        color: #ff7777;
    }

    .neutral {
        color: #dce5f3;
    }

    .feedback {
        margin-top: 15px;
        padding: 13px;
        border-radius: 12px;
        background: rgba(0,0,0,0.25);
        color: #dce5f3;
        line-height: 1.5;
        font-size: 14px;
    }

    .next-btn,
    .restart-btn {
        width: 100%;
        border: none;
        border-radius: 13px;
        padding: 15px;
        margin-top: 12px;
        background: #ffffff;
        color: #0b2344;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
    }

    .next-btn:active,
    .restart-btn:active {
        transform: scale(0.98);
    }

    .hidden {
        display: none;
    }

    .result {
        text-align: center;
    }

    .result h2 {
        font-size: 28px;
        margin-bottom: 10px;
    }

    .score {
        font-size: 42px;
        font-weight: bold;
        margin: 18px 0;
    }

    .final-stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin: 18px 0;
    }

    .final-stat {
        background: rgba(255,255,255,0.08);
        padding: 12px;
        border-radius: 10px;
    }

    .final-stat strong {
        display: block;
        font-size: 18px;
        margin-top: 4px;
    }

    .tip {
        color: #aebed4;
        font-size: 13px;
        line-height: 1.5;
        margin-top: 15px;
    }

    @media (max-width: 380px) {
        body {
            padding: 10px;
        }

        header h1 {
            font-size: 29px;
        }

        .game-card {
            padding: 14px;
        }

        h2 {
            font-size: 21px;
        }

        .option {
            padding: 13px;
        }
    }

    @media (min-height: 750px) and (max-width: 700px) {
        .game-card {
            margin-top: 8px;
        }

        .option {
            padding: 17px;
        }
    }
</style>
</head>

            <div class="stat-value debt" id="debt">£0</div>

    </div>

    <div class="game-card">

let state = {
    stage: 0,
    money: 1500,
    english: 50,
    experience: 0,
    happiness: 70,
    debt: 0
};

let answered = false;

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function updateStats() {

    document.getElementById("money").textContent =
        "£" + Math.round(state.money);

    document.getElementById("english").textContent =
        Math.round(state.english);

    document.getElementById("experience").textContent =
        Math.round(state.experience);

    document.getElementById("happiness").textContent =
        Math.round(state.happiness);

    document.getElementById("debt").textContent =
        "£" + Math.round(state.debt);
}

function formatEffect(value, positiveText, negativeText) {

    if (value > 0) {
        return `<span class="effect positive">+${value} ${positiveText}</span>`;
    }

    if (value < 0) {
        return `<span class="effect negative">${value} ${negativeText}</span>`;
    }

    return "";
}

function showStage() {

    answered = false;

    const stage = stages[state.stage];

    document.getElementById("stage").textContent =
        `Etapa ${state.stage + 1} de ${stages.length} • ${stage.type}`;

    document.getElementById("title").textContent =
        stage.title;

    document.getElementById("description").textContent =
        stage.description;

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    stage.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        let effects = "";

        if (option.cost > 0) {
            effects += `
                <span class="effect negative">
                    -£${option.cost}
                </span>
            `;
        }

        if (option.income > 0) {
            effects += `
                <span class="effect positive">
                    +£${option.income}
                </span>
            `;
        }

        effects += formatEffect(
            option.english,
            "inglês",
            "inglês"
        );

        effects += formatEffect(
            option.experience,
            "experiência",
            "experiência"
        );

        effects += formatEffect(
            option.happiness,
            "satisfação",
            "satisfação"
        );

        button.innerHTML = `
            <div class="option-title">
                ${option.title}
            </div>

            <div class="option-description">
                ${option.description}
            </div>

            <div class="effects">
                ${effects}
            </div>
        `;

        button.onclick = () => chooseOption(index);

        optionsContainer.appendChild(button);
    });

    updateStats();
}

function receiveMoney(amount) {

    if (!amount || amount <= 0) {
        return 0;
    }

    /*
        30% de qualquer renda é usada
        automaticamente para diminuir a dívida.
    */

    const debtPayment =
        Math.min(
            state.debt,
            Math.floor(amount * 0.30)
        );

    state.debt -= debtPayment;

    const remaining =
        amount - debtPayment;

    state.money += remaining;

    return debtPayment;
}

function chooseOption(index) {

    if (answered) return;

    answered = true;

    const option =
        stages[state.stage].options[index];

    let message = "";

    /*
        CASO NORMAL:
        o jogador consegue pagar.
    */

    if (state.money >= option.cost) {

        state.money -= option.cost;

        state.english += option.english || 0;
        state.experience += option.experience || 0;
        state.happiness += option.happiness || 0;

        if (option.income) {

            const debtPayment =
                receiveMoney(option.income);

            if (debtPayment > 0) {

                message =
                    `Você recebeu £${option.income}. ` +
                    `£${debtPayment} foram usados para diminuir sua dívida.`;
            }
            else {

                message =
                    `Você recebeu £${option.income}.`;
            }

        }

        if (!message) {
            message = "Sua escolha foi concluída.";
        }

    }

    /*
        CASO O JOGADOR NÃO TENHA DINHEIRO:
        ele entra em dívida e sofre consequências.
    */

    else {

        const missing =
            option.cost - state.money;

        const newDebt =
            Math.ceil(missing * 1.15);

        state.money = 0;

        state.debt += newDebt;

        state.english += option.english || 0;

        state.experience +=
            (option.experience || 0) - 5;

        state.happiness +=
            (option.happiness || 0) - 15;

        message =
            `Você não tinha dinheiro suficiente. ` +
            `Foi necessário pedir £${missing}, ` +
            `gerando £${newDebt} de dívida. ` +
            `Além disso, a situação afetou sua satisfação e experiência.`;
    }

    state.english =
        clamp(state.english, 0, 100);

    state.experience =
        clamp(state.experience, 0, 100);

    state.happiness =
        clamp(state.happiness, 0, 100);

    state.debt =
        Math.max(0, state.debt);

    updateStats();

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = `

        <div class="feedback">
            ${message}
        </div>

        <button class="next-btn" onclick="nextStage()">
            ${state.stage === stages.length - 1
                ? "Ver resultado"
                : "Continuar"}
        </button>
    `;
}

function nextStage() {

    state.stage++;

    if (state.stage >= stages.length) {
        showResult();
    }
    else {
        showStage();
    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function calculateScore() {

    let score = 0;

    score += state.english * 0.25;

    score += state.experience * 0.30;

    score += state.happiness * 0.25;

    score += Math.min(
        state.money / 25,
        15
    );

    score -= state.debt * 0.03;

    return Math.max(
        0,
        Math.round(score)
    );
}

function showResult() {

    document.getElementById("game")
        .classList.add("hidden");

    const result =
        document.getElementById("result");

    result.classList.remove("hidden");

    const score =

    let title = "";

    let description = "";

    if (state.debt >= 1000) {

        title =
            "Seu intercâmbio terminou com dificuldades";

        description =
            "Você viveu experiências importantes, " +
            "mas acumulou uma dívida muito alta. " +
            "Suas escolhas financeiras poderiam ter sido melhores.";

    }
    else if (score >= 75) {

        title =
            "Excelente intercâmbio!";

        description =
            "Você conseguiu equilibrar estudos, " +
            "experiências, trabalho e vida pessoal. " +
            "Seu intercâmbio foi um grande sucesso.";

    }
    else if (score >= 55) {

        title =
            "Um bom intercâmbio";

        description =
            "Você aproveitou bastante a experiência " +
            "e conseguiu lidar com boa parte dos desafios.";

    }
    else {

        title =
            "Um intercâmbio cheio de desafios";

        description =
            "Nem todas as escolhas deram certo, " +
            "mas você ganhou experiências que podem ajudar no futuro.";
    }

    result.innerHTML = `

        <h2>${title}</h2>

        <p>${description}</p>

        <div class="score">
            ${score}
        </div>

        <p>pontuação final</p>

        <div class="final-stats">

            <div class="final-stat">
                Dinheiro
                <strong>£${Math.round(state.money)}</strong>
            </div>

            <div class="final-stat">
                Inglês
                <strong>${Math.round(state.english)}</strong>
            </div>

            <div class="final-stat">
                Experiência
                <strong>${Math.round(state.experience)}</strong>
            </div>

            <div class="final-stat">
                Satisfação
                <strong>${Math.round(state.happiness)}</strong>
            </div>

            <div class="final-stat"
                 style="grid-column: span 2;">
                Dívida
                <strong>£${Math.round(state.debt)}</strong>
            </div>

        </div>

        <button class="restart-btn"
                onclick="restartGame()">
            Jogar novamente
        </button>

        <div class="tip">
            Cada escolha pode mudar sua experiência.
            Pense bem antes de decidir!
        </div>
    `;
}

function restartGame() {

    state = {
        stage: 0,
        money: 1500,
        english: 50,
        experience: 0,
        happiness: 70,
        debt: 0
    };

    document.getElementById("game")
        .classList.remove("hidden");

    document.getElementById("result")
        .classList.add("hidden");

    showStage();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

showStage();

</script>

</body>
</html>
